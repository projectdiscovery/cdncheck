name: 🔖 Release Tag

on:
  workflow_run:
    workflows: ["💡Fingerprint Update"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # A workflow_run start is accepted only from a successful scheduled or
    # manual run of the update workflow on main of this repository.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/fingerprint-update.yml' &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.get_commit.outputs.COMMIT_COUNT }}
      new_tag: ${{ steps.next_version.outputs.new_tag }}
      new_version: ${{ steps.next_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Get Commit Count
        id: get_commit
        run: git rev-list "$(git rev-list --tags --no-walk --max-count=1)"..HEAD --count | xargs -I {} echo COMMIT_COUNT={} >> "$GITHUB_OUTPUT"

      - name: Resolve next version
        if: ${{ steps.get_commit.outputs.COMMIT_COUNT > 0 }}
        id: next_version
        uses: mathieudutour/github-tag-action@fcfbdceb3093f6d85a3b194740f8c6cec632f4e2 # v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

  tag-release:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.commit_count > 0 }}
    permissions:
      contents: write
    env:
      NEW_TAG: ${{ needs.prepare.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Bump version in banner.go
        working-directory: internal/runner
        run: |
          grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${NEW_TAG}" || { echo "::error::bad version '${NEW_TAG}'"; exit 1; }
          sed -i -E "s|^const version = \`.*\`\$|const version = \`${NEW_TAG}\`|" banner.go
          grep -qF "const version = \`${NEW_TAG}\`" banner.go

      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet -- internal/runner/banner.go || git commit -m "Bump version" -- internal/runner/banner.go

      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Get latest version bump commit
        id: get_latest_commit
        run: echo "LATEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release and tag
        id: tag_version
        uses: mathieudutour/github-tag-action@fcfbdceb3093f6d85a3b194740f8c6cec632f4e2 # v6.1
        with:
          github_token: ${{ secrets.PDTEAMX_PAT }}
          custom_tag: ${{ needs.prepare.outputs.new_version }}
          commit_sha: ${{ steps.get_latest_commit.outputs.LATEST_COMMIT }}

      - name: Verify tag points at the bumped commit
        run: |
          git fetch origin --tags --force
          [ "$(git rev-list -n 1 "${NEW_TAG}")" = "${{ steps.get_latest_commit.outputs.LATEST_COMMIT }}" ] || { echo "::error::${NEW_TAG} does not point at the bumped commit"; exit 1; }

      - name: Create a GitHub release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.PDTEAMX_PAT }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          release_name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
