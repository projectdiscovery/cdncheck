name: 🎉 Release Binary

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      
      - name: "Verify banner.go version matches the tag"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          banner="$(sed -nE "s|^const version = \`(.*)\`\$|\1|p" internal/runner/banner.go)"
          [ "${banner}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} ships banner.go ${banner}"; exit 1; }

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with: 
          go-version: 1.25.x
      
      - name: "Create release on GitHub"
        uses: goreleaser/goreleaser-action@v6
        with: 
          args: "release --clean"
          version: latest
          workdir: .
        env: 
          GITHUB_TOKEN: "${{ secrets.PDTEAMX_PAT }}"
          SLACK_WEBHOOK: "${{ secrets.RELEASE_SLACK_WEBHOOK }}"
          DISCORD_WEBHOOK_ID: "${{ secrets.DISCORD_WEBHOOK_ID }}"
          DISCORD_WEBHOOK_TOKEN: "${{ secrets.DISCORD_WEBHOOK_TOKEN }}"